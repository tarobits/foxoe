[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foxoe"
version = "0.1.0"
description = "A local touchscreen and Stream Deck operating environment"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.10,<3", "pillow>=11,<13", "httpx>=0.27,<1", "anyio>=4,<5"]

[project.optional-dependencies]
device = ["streamdeck>=0.9.6,<1"]
test = ["pytest>=8,<10", "httpx2>=2,<3"]

[project.scripts]
foxoe = "foxoe.__main__:main"

[tool.setuptools]
packages = ["foxoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
